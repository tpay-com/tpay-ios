name: Publish release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  publish_release:
    if: github.event.pull_request.merged && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: macos-26
    env:
      XCODE_PATH: /Applications/Xcode_26.4.app
    steps:

    - name: Extract version from branch name (for release branches)
      if: startsWith(github.event.pull_request.head.ref, 'release/')
      run: |
        BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
        VERSION=${BRANCH_NAME#release/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Extract version from branch name (for hotfix branches)
      if: startsWith(github.event.pull_request.head.ref, 'hotfix/')
      run: |
        BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
        VERSION=${BRANCH_NAME#hotfix/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Checkout Source
      uses: actions/checkout@v2

    - name: Update release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        tag: ${{ env.RELEASE_VERSION }}

    - name: Select Xcode
      run: sudo xcode-select -s ${{ env.XCODE_PATH }}

    - name: Validate manifest
      run: swift package dump-package
